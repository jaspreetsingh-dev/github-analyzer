<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/style.css">
    <title>Github Analyzer</title>
</head>
<body>
<nav>
    <div class="nav-logo">
        <span class="dot"></span>
        GitHub Analyzer
    </div>
</nav>
<section class="hero">
    <h1 class="site-title">Github Analyzer</h1>
    <p class="tagline">A mirror for your GitHub. Brutally honest. Occasionally apologetic.</p
        >
    <div class="input-row">
        <input type="text" placeholder="enter first username" id="username-input">
        <input type="text" placeholder="enter second username" id="username2-input">
        <button id="analyze-btn">Analyze</button>
    </div>
    <p class="hint">// try: torvalds, gvanrossum, sindresorhus</p>
</section>
<div id="results"></div>

<script>
    document.getElementById("analyze-btn").addEventListener("click", function() {
        const username = document.getElementById("username-input").value.trim()
        const username2 = document.getElementById("username2-input").value.trim()

        if (username === "") {
            document.getElementById("results").innerHTML = "<p>Please enter the first username</p>"
            return
        }
        if (username2 === "") {
            document.getElementById("results").innerHTML = "<p>Please enter the second username</p>"
            return 
        }

        document.getElementById("results").innerHTML = `<p>Analyzing ${username} and ${username2}... this takes a few seconds</p>`

        fetch(`/compare/${username}/${username2}`)
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    document.getElementById("results").innerHTML = `<p>${data.error}</p>`
                } else {
                    const loser = data.winner === username ? username2 : username
                    document.getElementById("results").innerHTML = `
                    <div class="results-card">
                        <h1>${data.user1.profile.name || data.user1.profile.login}</h1>
                        <p>${data.user1.summary}</p>
                        <p>📊 Codex Score: ${data.user1.codex_score} / 100</p>
                        <p>⭐ Stars: ${data.user1.stats.total_stars}</p>
                        <p>🍴 Forks: ${data.user1.stats.total_forks}</p>
                        <p>👥 Followers: ${data.user1.profile.followers}</p>
                        <p>📁 Repos: ${data.user1.profile.public_repos}</p>
                        <p>💻Languages: ${Object.keys(data.user1.stats.languages).join(", ")}</p>
                        <p>${data.user1.badges.join(", ")}</p>
                    </div>
                    <div class="results-card">
                        <h1>${data.user2.profile.name || data.user2.profile.login}</h1>
                        <p>${data.user2.summary}</p>
                        <p>📊 Codex Score: ${data.user2.codex_score} / 100</p>
                        <p>⭐ Stars: ${data.user2.stats.total_stars}</p>
                        <p>🍴 Forks: ${data.user2.stats.total_forks}</p>
                        <p>👥 Followers: ${data.user2.profile.followers}</p>
                        <p>📁 Repos: ${data.user2.profile.public_repos}</p>
                        <p>💻 Languages: ${Object.keys(data.user2.stats.languages).join(", ")}</p>
                        <p>${data.user2.badges.join(", ")}</p>
                    </div>
                    <div class="results-card">    
                        <p>🏆 ${data.winner} wins.</p>
                        <p>Sorry ${loser}. The algorithm has spoken. No appeals accepted.</p>
                    </div>
                    `
                }
            })
    })
</script>
</body>
</html>
