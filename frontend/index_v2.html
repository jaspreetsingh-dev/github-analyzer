<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/style.css">
    <title>Github Analyzer</title>
</head>
<body>
<nav>
    <div class="nav-logo">
        <span class="dot"></span>
        GitHub Analyzer
    </div>
</nav>
<section class="hero">
    <h1 class="site-title">Github Analyzer</h1>
    <h1 class="tagline">A mirror for your GitHub. Brutally honest. Occasionally apologetic.</h1>
    <div class="input-row">
        <input type="text" placeholder="enter username" id="username-input">
        <button id="analyze-btn">Analyze</button>
    </div>
    <p class="hint">// try: torvalds, gvanrossum, sindresorhus</p>
</section>
<div id="results"></div>

<script>
    document.getElementById("analyze-btn").addEventListener("click", function() {
        const username = document.getElementById("username-input").value.trim()
        if (username === "") {
            document.getElementById("results").innerHTML = "<p>Please enter a username</p>"
            return 
        }
        document.getElementById("results").innerHTML = "<p>Analyzing....</p>"
        fetch(`http://127.0.0.1:5000/analyze/${username}`)
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    document.getElementById("results").innerHTML = `<p>${data.error}</p>`
                } else {
                    document.getElementById("results").innerHTML = `
                        <div class="results-card">
                            <img src="${data.profile.avatar_url}" width="80">
                            <h2>${data.profile.login}</h2>
                            <p>${data.summary}</p>
                        </div>
                        <div class="results-card">
                            <p>Codex Score: ${data.codex_score} / 100</p>
                            <p>⭐ Stars: ${data.stats.total_stars}</p>
                            <p>🍴 Forks: ${data.stats.total_forks}</p>
                            <p>👥 Followers: ${data.profile.followers}</p>
                        </div>
                        <div class="results-card">
                            <p>Badges: ${data.badges.join(", ")}</p>
                            <p>Languages: ${Object.keys(data.stats.languages).join(", ")}</p>
                        </div>
                        <div class="result-card">
                            <p>// compare with another developer</p>
                            <div class="input-row">
                                <input type="text" id="compare-input" placeholder="enter second username">
                                <button id="compare-btn">Compare</button>
                            </div>
                        </div>
                    `

                    document.getElementById("compare-btn").addEventListener("click", function() {
                        const username2 = document.getElementById("compare-input").value.trim()
                        if (username2 === "") {
                            document.getElementById("results").innerHTML = "<p>Please enter a second username</p>"
                            return 
                        }
                        document.getElementById("results").innerHTML = "<p>Analyzing....</p>"
                        fetch(`http://127.0.0.1:5000/compare/${username}/${username2}`)
                            .then(response => response.json())
                            .then(compareData => {
                                document.getElementById("results").innerHTML = `
                                    <div class="result-card">
                                        <h2>${compareData.user1.profile.login}</h2>
                                        <p>${compareData.user1.summary}</p>
                                        <p>Codex Score: ${compareData.user1.codex_score}</p>
                                    </div> 
                                    <div class="result-card">
                                        <h2>${compareData.user2.profile.login}</h2>
                                        <p>${compareData.user2.summary}</p>
                                        <p>Codex Score: ${compareData.user2.codex_score}</p>
                                    </div>      
                                    <div class="result-card">
                                        <p>🏆 Winner: ${compareData.winner}</p>
                                    </div>
                                `
                            })
                    })
                }
            })
    })

</script>

</body>
</html>
