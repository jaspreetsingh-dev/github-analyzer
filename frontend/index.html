<!DOCTYPE html>
<html lang="en">
<head>
<title>github Analyzer</title>
</head>
<body>
    <h1>Github Profile Analyzer</h1>
    <input placeholder="username" id="username-input">
    <button id="analyze-btn">Analyze</button>
    <div id="results"></div>

<script>
document.getElementById("analyze-btn").addEventListener("click", function(){
    const username = document.getElementById("username-input").value
    if(username.trim() === "") {
        document.getElementById("results").innerHTML = "<p>Please enter a username</P>"
        return
    }
    document.getElementById("results").innerHTML = "<p>Analyzing....</p>"
    fetch(`http://127.0.0.1:5000/analyze/${username}`)
        .then(response => response.json())
        .then(data => {
            if(data.error) {
                document.getElementById("results").innerHTML = `<p>Error: ${data.error}</p>`
            } else {
                document.getElementById("results").innerHTML = `
                    <img src="${data.profile.avatar_url}" width="100" height="100">
                    <h2>${data.summary}</h2>
                    <p>⭐ Total Stars: ${data.stats.total_stars}</p>
                    <p>🍴 Total Forks: ${data.stats.total_forks}</p>
                    <p>📊 Codex Score: ${data.codex_score}/100</p>
                    <p>🌐 Languages: ${Object.keys(data.stats.languages).join(", ")}</p>
                    <p>🎖️ Badges: ${data.badges.join(", ")}</p>
        `
    }
})
        })

</script>

</body>
</html>
