<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Analyzer</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/frontend/style.css" />
</head>
<body>

  <section class="hero">

    <div class="flower-bg"></div>

    <div class="hero-inner">

<div class="heading-wrap">
  <h1 class="heading">GITHUB<br>ANALYZER</h1>
</div>

      <div class="center">
        <p class="subheading">to compare — commit histories have become personality traits.</p>

        <div class="inputs">
          <div class="input-group">
            <input type="text" id="user1" placeholder="first username" autocomplete="off" />
          </div>
          <span class="vs">vs</span>
          <div class="input-group">
            <input type="text" id="user2" placeholder="second username" autocomplete="off" />
          </div>
        </div>

        <button class="analyze-btn" id="analyze-btn">decide ⮞</button>
        <p id="error-message"></p>
        <p id="status-text"></p>
      </div>

    </div>

  </section>

<script>

document.getElementById("analyze-btn")
  .addEventListener("click", async function () {

    const user1 =
      document.getElementById("user1").value.trim()

    const user2 =
      document.getElementById("user2").value.trim()

    const errorBox =
      document.getElementById("error-message")

    errorBox.textContent = ""

    if (user1 === "" || user2 === "") {

      errorBox.textContent =
        "please enter both usernames"

      return
    }

    // ANALYZING STATE
    errorBox.textContent =
      "analyzing github history..."

    try {

      const response = await fetch(
        `http://127.0.0.1:5000/compare/${user1}/${user2}`
      )

      const data = await response.json()

      if (data.error) {

        errorBox.textContent =
          data.error

        return
      }
      sessionStorage.setItem(
        "comparisonData",
        JSON.stringify(data)
      )

      window.location.href =
        `/frontend/results.html?user1=${user1}&user2=${user2}`

    } catch (error) {

      console.error(error)

      errorBox.textContent =
        "server unavailable"

    }

})

</script>

</body>
</html>
